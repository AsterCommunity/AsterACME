name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup show
      - run: python3 scripts/check-workspace-deps.py
      - run: python3 scripts/check-rust-imports.py
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/check-tls-backend.py
      - run: python3 scripts/check-dependency-features.py
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - if: runner.os != 'Windows'
        run: python3 scripts/test-confirmation-terminal.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  precheck-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/check-precheck-features.py

  coverage:
    runs-on: ubuntu-latest
    env:
      # CI 每个任务只做一次干净构建，增量产物只占磁盘不提供本地反馈
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: mkdir -p coverage/rust
      - run: cargo llvm-cov --workspace --locked --no-fail-fast --lcov --output-path coverage/rust/lcov.info
      - name: Publish coverage summary
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        run: node scripts/coverage-summary.mjs "Rust" coverage/rust/lcov.info
      - name: Upload coverage reports to Codecov
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: rust-backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          if-no-files-found: ignore
          path: coverage/rust
