name: Question
description: Ask a question about using AsterACME
title: "[Question]: "
labels: ["Question"]
assignees:
  - AptS-1547
body:
  - type: markdown
    attributes:
      value: |
        Before asking, the [CLI contract](https://github.com/AsterCommunity/AsterACME/blob/main/docs/cli-contract.md) and the [RFC reference](https://github.com/AsterCommunity/AsterACME/blob/main/docs/rfc-reference.md) answer most protocol and command questions.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Build / installation
        - CLI usage
        - Configuration
        - Embedding the library
        - ACME protocol behavior
        - Renewal / deployment
        - Troubleshooting
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - AsterACME version:
        - Installation method:

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the documentation
          required: true
        - label: I have searched existing issues
          required: true
