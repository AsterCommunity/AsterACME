[package]
name = "aster_acme_cli"
version = "0.1.0-alpha.3"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for AsterACME."
publish.workspace = true
keywords = ["acme", "certificate", "letsencrypt", "cli", "automation"]
categories = ["command-line-utilities", "authentication"]
readme = "README.md"

[[bin]]
name = "aster-acme"
path = "src/main.rs"
doc = false

# cargo-binstall maps the crate to the release assets published by the
# tag-driven workflow; platforms follow the workflow matrix naming.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-{ target }"
bin-dir = "aster-acme-v{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-linux-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-macos-amd64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-macos-arm64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-windows-amd64.exe"
bin-dir = "aster-acme-v{ version }-windows-amd64.exe"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/aster-acme-v{ version }-windows-arm64.exe"
bin-dir = "aster-acme-v{ version }-windows-arm64.exe"

[features]
default = [
    "precheck",
    "dns-cloudflare",
    "dns-aliyun",
    "dns-tencent-cloud",
    "dns-huawei-cloud",
]
precheck = ["dep:aster_acme_validation", "aster_acme/precheck-http", "aster_acme_validation/precheck-caa", "aster_acme_validation/precheck-dns"]

dns-cloudflare = ["aster_acme_dns_builtin/cloudflare"]
dns-aliyun = ["aster_acme_dns_builtin/aliyun"]
dns-tencent-cloud = ["aster_acme_dns_builtin/tencent_cloud"]
dns-huawei-cloud = ["aster_acme_dns_builtin/huawei_cloud"]
dns-google-cloud-dns = ["aster_acme_dns_builtin/google_cloud_dns"]

[dependencies]
aster_acme_dns_builtin.workspace = true
aster_acme_dns_http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rcgen.workspace = true
url.workspace = true
sha2.workspace = true
base64.workspace = true
aster_forge_panic.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
aster_acme_validation = { workspace = true, optional = true }
aster_acme_protocol.workspace = true
aster_acme.workspace = true
aster_acme_core.workspace = true
aster_acme_cli_storage.workspace = true
aster_forge_process.workspace = true
aster_acme_dns.workspace = true
aster_acme_dns_adpp.workspace = true
aster_acme_dns_resolver.workspace = true
clap.workspace = true
directories.workspace = true
inquire.workspace = true
unicode-width.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
shlex.workspace = true
aster_forge_utils.workspace = true
crossterm.workspace = true

[target.'cfg(not(unix))'.dependencies]
tempfile.workspace = true

[build-dependencies]
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
rcgen.workspace = true
x509-parser.workspace = true

[lints]
workspace = true
