[package]
name = "aster_acme_validation"
version = "0.1.0-alpha.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DNS-01 challenge automation for AsterACME."
publish.workspace = true
readme = "README.md"

[features]
default = []
dns01 = ["dep:hickory-resolver", "dep:thiserror"]
precheck-caa = ["dep:aster_acme_protocol", "dep:hickory-resolver", "dep:aster_acme_core", "dep:thiserror", "aster_acme/precheck"]
precheck-dns = ["dns01", "aster_acme/precheck"]

[dependencies]
thiserror = { workspace = true, optional = true }
async-trait.workspace = true
hickory-resolver = { workspace = true, optional = true }
tokio.workspace = true
aster_acme.workspace = true
aster_acme_core = { workspace = true, optional = true }
aster_acme_protocol = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio-util.workspace = true

[lints]
workspace = true

[[example]]
name = "caa_precheck"
required-features = ["precheck-caa"]
