[package]
name = "aster_acme_validation"
version = "0.1.0-alpha.3"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DNS-01 challenge automation for AsterACME."
publish.workspace = true
keywords = ["acme", "dns", "dns-01", "caa", "tls"]
categories = ["authentication", "network-programming"]
readme = "README.md"

[features]
default = []
dns01 = ["dep:aster_acme", "dep:async-trait", "dep:hickory-resolver", "dep:thiserror", "dep:tokio"]
precheck-caa = ["dep:aster_acme", "dep:async-trait", "dep:aster_acme_protocol", "dep:hickory-resolver", "dep:aster_acme_core", "dep:thiserror", "dep:tokio", "aster_acme/precheck"]
precheck-dns = ["dns01", "aster_acme/precheck"]

[dependencies]
thiserror = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
aster_acme = { workspace = true, optional = true }
aster_acme_core = { workspace = true, optional = true }
aster_acme_protocol = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
tokio-util.workspace = true

[lints]
workspace = true

[[example]]
name = "caa_precheck"
required-features = ["precheck-caa"]
