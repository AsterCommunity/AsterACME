[package]
name = "aster_acme_dns_builtin"
version = "0.1.0-alpha.2"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-selected DNS provider state machines without network or filesystem access."
publish.workspace = true
keywords = ["acme", "dns", "dns-01", "cloudflare", "provider"]

[features]
default = []
cloudflare = ["dep:linkme"]
aliyun = ["dep:aws-lc-rs", "dep:httpdate", "dep:linkme", "dep:time", "dep:zeroize"]
tencent_cloud = ["dep:aws-lc-rs", "dep:httpdate", "dep:linkme", "dep:time", "dep:zeroize"]
huawei_cloud = ["dep:aws-lc-rs", "dep:httpdate", "dep:linkme", "dep:time", "dep:url", "dep:zeroize"]

[dependencies]
aster_acme_dns.workspace = true
serde.workspace = true
serde_json.workspace = true
aws-lc-rs = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
time = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[lints]
workspace = true
