[package]
name = "aster_acme_dns_builtin"
version = "0.1.0-alpha.3"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-selected DNS provider state machines without network or filesystem access."
publish.workspace = true
keywords = ["acme", "dns", "dns-01", "cloudflare", "provider"]
categories = ["authentication", "network-programming"]
readme = "README.md"

[features]
default = []
cloudflare = ["_http", "_publication-markers"]
aliyun = ["_individual-records"]
tencent_cloud = ["_individual-records"]
huawei_cloud = ["_signed-api", "_publication-markers", "_txt", "dep:url"]
google_cloud_dns = ["_rpc", "_txt", "dep:aws-lc-rs", "dep:time", "dep:zeroize", "dep:url", "dep:base64"]
# Implementation capabilities: selected automatically by vendor features.
_publication-markers = []
_txt = []
_http = ["dep:linkme"]
_rpc = ["_http", "dep:httpdate"]
_signed-api = ["_rpc", "dep:aws-lc-rs", "dep:time", "dep:zeroize"]
_individual-records = ["_signed-api", "_publication-markers"]

[dependencies]
aster_acme_dns.workspace = true
serde.workspace = true
serde_json.workspace = true
aws-lc-rs = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
time = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[lints]
workspace = true
