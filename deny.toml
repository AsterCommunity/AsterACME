# cargo-deny 配置：Rust 依赖审计统一入口（licenses + bans + advisories + sources）
# 组织级统一；AsterDrive 同款基线（GPL 一律不放行）。

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# 仅列当前依赖树真实命中的上游例外；包含无兼容修复的残留风险，
# 不表示漏洞已经修复。上游发版后立即移除对应条目并刷新 Cargo.lock。
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    # option-ext；MPL-2.0 是文件级 copyleft，链接不受传染
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Mozilla 根证书数据（Mozilla CA 证书库），仅数据非代码
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # 仅在 UEFI target 下被 getrandom 引用，实际分发目标（容器/服务器二进制）不编译
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["AsterCommunity"]
