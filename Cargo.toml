[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = [
    "AsterCommunity Contributors <contributors@astercosm.com>",
]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsterCommunity/AsterACME"
publish = false

# All dependency versions and feature selections belong here.
# Members must inherit dependencies with `workspace = true`.
[workspace.dependencies]
aster_forge_http = { git = "https://github.com/AsterCommunity/AsterForge", rev = "beb3d45faad47ca9e53e3f704e0db57c686a4882", default-features = false }
# Shared wire-enum generation; pin the published Forge revision.
aster_forge_utils = { git = "https://github.com/AsterCommunity/AsterForge", rev = "beb3d45faad47ca9e53e3f704e0db57c686a4882" }
aster_forge_macros = { git = "https://github.com/AsterCommunity/AsterForge", rev = "beb3d45faad47ca9e53e3f704e0db57c686a4882" }
aster_acme_protocol = { path = "crates/aster_acme_protocol" }
aster_acme_core = { path = "crates/aster_acme_core" }
aster_acme = { path = "crates/aster_acme" }
aster_acme_dns = { path = "crates/aster_acme_dns" }
aster_acme_cli_storage = { path = "crates/aster_acme_cli_storage" }
aster-fs = { git = "https://github.com/AsterCommunity/AsterFs", rev = "913ed30598119c184f49f18e5b339fc98869fff2", default-features = false, features = ["sync"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
toml_edit = "0.25.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
inquire = "0.9"
unicode-width = "0.2"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
base64 = "0.22"
idna = "1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
hmac = "0.12"
httpdate = "1"
percent-encoding = "2"
rustix = { version = "1.1", features = ["fs", "process"] }
tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
