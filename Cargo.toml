[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = [
    "AsterCommunity Contributors <contributors@astercosm.com>",
]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsterCommunity/AsterACME"
publish = false

# All dependency versions and feature selections belong here.
# Members must inherit dependencies with `workspace = true`.
[workspace.dependencies]
aster-acme-core = { path = "crates/aster-acme-core" }
aster-acme = { path = "crates/aster-acme" }
aster-acme-dns = { path = "crates/aster-acme-dns" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
