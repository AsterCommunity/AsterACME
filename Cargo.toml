[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = [
    "AsterCommunity Contributors <contributors@astercosm.com>",
]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsterCommunity/AsterACME"
publish = false

# All dependency versions and feature selections belong here.
# Members must inherit dependencies with `workspace = true`.
[workspace.dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
aster_forge_http = { version = "=0.1.0-alpha.2", default-features = false, features = ["json", "rustls-aws-lc-rs", "system-proxy"] }
# Shared Forge crates use explicit published alpha versions.
aster_forge_utils = { version = "=0.1.0-alpha.1" }
aster_forge_panic = { version = "=0.1.0-alpha.2", default-features = false }
aster_forge_macros = { version = "=0.1.0-alpha.1" }
aster_acme_protocol = { path = "crates/aster_acme_protocol" }
aster_acme_core = { path = "crates/aster_acme_core" }
aster_acme = { path = "crates/aster_acme" }
aster_acme_validation = { path = "crates/aster_acme_validation" }
aster_acme_cli_storage = { path = "crates/aster_acme_cli_storage" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "signal"] }
# Forge HTTP selects transport features; this entry supplies shared public types only.
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
toml_edit = "0.25.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
unicode-width = "0.2"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
base64 = "0.23.1"
idna = "1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
aws-lc-rs = { version = "1.19", default-features = false, features = ["non-fips", "alloc"] }
hmac = "0.13"
httpdate = "1"
percent-encoding = "2"
rustix = { version = "1.1", features = ["fs", "process"] }
tempfile = "3"
wiremock = "0.6"
winapi-util = "0.1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

# Release policy applies to the CLI and its workspace dependencies.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Retain function symbols for useful panic backtraces without source-level debug data.
debug = 0
# Allow unwinding through task/operation boundaries; stack overflow and OOM remain fatal.
panic = "unwind"
strip = "debuginfo"
